<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexie Koishiro — Portafolio</title>
    <!-- Nuevas tipografías: Yuji Syuku (trazo asiático) + Space Grotesk (toque cyber) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Yuji+Syuku&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="brand-box">
                <span class="brand-name">LEXIE KOISHIRO</span>
                <span class="brand-symbol">⛩ ✦ ⛩</span>
            </a>

            <nav class="nav-links">
                <a href="#sobre-mi">Sobre mí</a>
                <a href="#talleres">Pedagogía & Talleres</a>
                <a href="#portafolio" class="active">Portafolio</a>
                <a href="#eventos">Eventos</a>
                <a href="#contacto">Contacto</a>
            </nav>

            <div class="nav-socials">
                <a href="https://instagram.com" target="_blank" aria-label="Instagram">IG</a>
                <a href="mailto:tu-correo@ejemplo.com" aria-label="Correo">✉</a>
            </div>
        </div>
    </header>

    <!-- HERO CON EFECTO LINTERNA -->
    <section class="hero" id="hero-cave">
        <!-- Capa de oscuridad dinámica -->
        <div class="cave-flashlight"></div>
        
        <div class="hero-content">
            <span class="cyber-tag">[ ARCHIVO_00 // RITUAL_VIVO ]</span>
            <h1>Portafolio</h1>
            <p class="hero-subtitle">Galería y <em>Performances en Vivo</em></p>
        </div>
    </section>

    <!-- EL RESTO DE TU MAIN Y FOOTER SE QUEDAN IGUAL POR AHORA... -->
    <!-- (Aquí va tu <main> y tu <footer> que ya tenías) -->

    <!-- SCRIPT PARA LA LINTERNA EN LA CUEVA -->
    <script>
        const hero = document.getElementById('hero-cave');
        const flashlight = document.querySelector('.cave-flashlight');

        hero.addEventListener('mousemove', (e) => {
            const rect = hero.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            flashlight.style.setProperty('--x', `${x}px`);
            flashlight.style.setProperty('--y', `${y}px`);
        });

        // Soporte táctil para celulares (ilumina donde toques)
        hero.addEventListener('touchmove', (e) => {
            const rect = hero.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            flashlight.style.setProperty('--x', `${x}px`);
            flashlight.style.setProperty('--y', `${y}px`);
        });
    </script>
</body>
</html>
